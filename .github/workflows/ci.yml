name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*-preview.*'

permissions:
  contents: read

jobs:
  repository:
    name: Repository and client checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Ruby for workflow contract parsing
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Set up Java for Android Gradle configuration tests
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Run repository tests
        run: python -m unittest discover -s tests -v

      - name: Run Android configuration checks
        run: |
          python clients/android/scripts/verify_private_chat_android_config.py
          python clients/android/scripts/tests/test_private_chat_api_config.py
          python clients/android/scripts/tests/test_chat_branding_localization.py
          python clients/android/scripts/tests/test_android_emulator_smoke.py
          python clients/android/scripts/tests/test_private_chat_signing_config.py

      - name: Run iOS configuration checks
        env:
          PYTHONPATH: clients/ios
        run: |
          python clients/ios/scripts/verify_private_chat_ios_config.py
          python clients/ios/scripts/tests/test_chat_app_branding.py

      - name: Run desktop configuration checks
        run: |
          python clients/desktop/scripts/verify_private_chat_desktop_config.py
          python clients/desktop/scripts/test_verify_private_chat_desktop_config.py
          python clients/desktop/scripts/test_chat_desktop_branding.py

  server:
    name: Server offline unit packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python for local runtime checks
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Test local runtime configuration
        run: python -m unittest server.integration.test_local_runtime server.integration.test_run_local -v

      - name: Test scoped offline unit packages
        working-directory: server
        run: go test ./pkg/hashx ./pkg/phonenumber ./pkg/mention ./pkg/code/none ./pkg/code/localfile ./app/interface/session/internal/sess ./app/bff/authorization/internal/core ./app/interface/gnetway/internal/dao

  server-build-preview:
    name: Linux server preview binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Build server services
        working-directory: server
        run: make all

      - name: Verify and archive server binaries
        run: |
          for binary in idgen status dfs media authsession biz msg sync bff session gnetway; do
            test -x "server/teamgramd/bin/${binary}"
          done
          tar -czf "${RUNNER_TEMP}/chat-server-linux-preview.tar.gz" \
            -C server/teamgramd/bin \
            idgen status dfs media authsession biz msg sync bff session gnetway

      - name: Upload Linux server preview
        uses: actions/upload-artifact@v7
        with:
          name: chat-server-linux-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chat-server-linux-preview.tar.gz
          if-no-files-found: error
          retention-days: 14

  web-build-preview:
    name: Web client checks and preview build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/web/package-lock.json

      - name: Install Web client dependencies
        working-directory: clients/web
        run: npm ci

      - name: Verify protocol layer
        working-directory: clients/web
        run: npm run verify:protocol

      - name: Run Web client tests
        working-directory: clients/web
        run: npm test

      - name: Build Web client
        working-directory: clients/web
        run: npm run build

      - name: Upload Web preview
        uses: actions/upload-artifact@v7
        with:
          name: chat-web-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: clients/web/dist/
          if-no-files-found: error
          retention-days: 14

  android-compile:
    name: Android afatDebug APK preview
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platforms;android-35
            build-tools;35.0.0
            cmake;3.10.2.4988404
            ndk;27.2.12479018

      - name: Build Android afatDebug APK
        working-directory: clients/android
        env:
          PRIVATE_CHAT_API_ID: "123456"
          PRIVATE_CHAT_API_HASH: "0123456789abcdef0123456789abcdef"
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon

      - name: Upload Android debug APK preview
        uses: actions/upload-artifact@v7
        with:
          name: chat-android-afat-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: clients/android/TMessagesProj_App/build/outputs/apk/afat/debug/app.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  android-emulator-smoke:
    name: Android Simplified Chinese first-launch smoke
    needs:
      - android-compile
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and emulator
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            emulator
            platform-tools
            platforms;android-35
            system-images;android-35;google_apis;x86_64

      - name: Download Android debug APK
        uses: actions/download-artifact@v7
        with:
          name: chat-android-afat-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chat-android-afat-debug

      - name: Create and boot Android emulator
        run: |
          android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          android_adb="${android_sdk}/platform-tools/adb"
          echo "no" | "${android_sdk}/cmdline-tools/latest/bin/avdmanager" create avd \
            --force \
            --name chat-ci \
            --package 'system-images;android-35;google_apis;x86_64' \
            --device pixel_2
          "${android_sdk}/emulator/emulator" -avd chat-ci \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            > "${RUNNER_TEMP}/chat-android-emulator.log" 2>&1 &
          emulator_pid=$!
          device_ready=false
          for attempt in $(seq 1 90); do
            if "${android_adb}" -s emulator-5554 get-state >/dev/null 2>&1; then
              device_ready=true
              break
            fi
            if ! kill -0 "${emulator_pid}" 2>/dev/null; then
              cat "${RUNNER_TEMP}/chat-android-emulator.log"
              echo "Android emulator exited before becoming available." >&2
              exit 1
            fi
            sleep 2
          done
          if [ "${device_ready}" != "true" ]; then
            cat "${RUNNER_TEMP}/chat-android-emulator.log"
            echo "Android emulator did not become available." >&2
            exit 1
          fi
          for attempt in $(seq 1 90); do
            if [ "$("${android_adb}" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              exit 0
            fi
            if ! kill -0 "${emulator_pid}" 2>/dev/null; then
              cat "${RUNNER_TEMP}/chat-android-emulator.log"
              echo "Android emulator exited before finishing boot." >&2
              exit 1
            fi
            sleep 2
          done
          cat "${RUNNER_TEMP}/chat-android-emulator.log"
          echo "Android emulator did not finish booting." >&2
          exit 1

      - name: Verify clean first launch is Simplified Chinese
        run: >-
          python3 clients/android/scripts/smoke_android_emulator.py
          --apk "${RUNNER_TEMP}/chat-android-afat-debug/app.apk"
          --serial emulator-5554
          --adb "${ANDROID_HOME}/platform-tools/adb"
          --timeout-seconds 180

  ios-simulator-build:
    name: iOS simulator build (unsigned)
    runs-on: xcode-27
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python for the iOS build generator
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Show Apple build toolchain
        run: |
          xcodebuild -version
          swiftc --version

      - name: Verify iOS branding and bundled localization
        working-directory: clients/ios
        run: python3 -m unittest scripts.tests.test_chat_app_branding -v

      - name: Test iOS simulator artifact resolution
        run: python3 clients/ios/scripts/tests/test_resolve_simulator_app.py -v

      - name: Test headless Xcode project generation
        working-directory: clients/ios
        run: python3 scripts/tests/test_make_project_generation.py

      - name: Verify Swift 5 warning policy
        working-directory: clients/ios
        run: python3 scripts/tests/test_telegram_core_swift_warnings.py

      - name: Generate unsigned simulator project
        working-directory: clients/ios
        run: |
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            --cacheDir="${RUNNER_TEMP}/private-chat-ios-bazel-cache" \
            generateProject \
            --configurationPath=build-system/template_minimal_development_configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --disableProvisioningProfiles \
            --disableExtensions \
            --noOpen

      - name: Build iOS simulator app without signing
        working-directory: clients/ios
        run: |
          xcodebuild \
            -project Telegram/Telegram.xcodeproj \
            -scheme Telegram \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${RUNNER_TEMP}/private-chat-ios-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Archive unsigned iOS simulator app
        run: |
          simulator_app="$(python3 clients/ios/scripts/resolve_simulator_app.py \
            "${RUNNER_TEMP}/private-chat-ios-derived-data/Build/Products/Debug-iphonesimulator")"
          ditto -c -k --sequesterRsrc --keepParent \
            "${simulator_app}" \
            "${RUNNER_TEMP}/Chat-iOS-Simulator.zip"

      - name: Upload unsigned iOS simulator preview
        uses: actions/upload-artifact@v7
        with:
          name: chat-ios-simulator-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/Chat-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14

  desktop-packaging-metadata:
    name: Desktop packaging metadata (${{ matrix.os }})
    if: github.event_name == 'pull_request' || github.ref_type == 'branch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-26
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check desktop client configuration
        run: python clients/desktop/scripts/verify_private_chat_desktop_config.py

      - name: Check desktop branding and packaging metadata
        run: python clients/desktop/scripts/test_chat_desktop_branding.py

  desktop-build-preview:
    name: Desktop Debug packages (all platforms)
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && contains(github.ref_name, '-preview.')
    permissions:
      contents: read
    uses: ./.github/workflows/desktop-build.yml
    with:
      platform: all

  candidate-package:
    name: Assemble checksummed preview candidate
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && contains(github.ref_name, '-preview.')
    needs:
      - repository
      - server
      - server-build-preview
      - web-build-preview
      - android-compile
      - android-emulator-smoke
      - ios-simulator-build
      - desktop-build-preview
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload_candidate.outputs.artifact-id }}
    steps:
      - name: Check out tagged source for the package builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Download same-run build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          path: ${{ runner.temp }}/chat-candidate-artifacts

      - name: Assemble preview candidate and checksums
        run: |
          python3 tools/package_candidate_release.py \
            --artifacts-dir "${RUNNER_TEMP}/chat-candidate-artifacts" \
            --output-dir "${RUNNER_TEMP}/chat-candidate-release" \
            --tag "${GITHUB_REF_NAME}" \
            --revision "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}"

      - name: Upload candidate release bundle
        id: upload_candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: chat-candidate-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chat-candidate-release/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  candidate-release:
    name: Create draft preview release
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && contains(github.ref_name, '-preview.')
    needs: candidate-package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: candidate-preview-release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Download checksummed candidate
        id: download_candidate
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          artifact-ids: ${{ needs.candidate-package.outputs.artifact_id }}
          path: ${{ runner.temp }}/chat-candidate-release

      - name: Explain how to recover a missing candidate
        if: steps.download_candidate.outcome != 'success'
        run: |
          echo "The candidate artifact is unavailable to this workflow attempt." >&2
          echo "Re-run all jobs in this workflow run to rebuild and upload the candidate." >&2
          exit 1

      - name: Verify candidate bundle checksum
        run: |
          cd "${RUNNER_TEMP}/chat-candidate-release"
          sha256sum --check SHA256SUMS

      - name: Create or resume draft preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          candidate_dir="${RUNNER_TEMP}/chat-candidate-release"
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq .sha)"
          if [ "${tag_sha}" != "${GITHUB_SHA}" ]; then
            echo "The preview tag no longer points to the built source revision." >&2
            exit 1
          fi

          release_notes="Unsigned preview candidate for review.
          Source revision: ${GITHUB_SHA}
          Workflow run ID: ${GITHUB_RUN_ID}
          This is not a stable or signed production release."
          existing_release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" 2>/dev/null || true)"
          if [ -n "${existing_release}" ]; then
            if ! jq -e \
              --arg tag "${GITHUB_REF_NAME}" \
              --arg revision "${GITHUB_SHA}" \
              --arg run_id "${GITHUB_RUN_ID}" \
              '.tag_name == $tag and .draft == true and .prerelease == true and (.body | contains($revision)) and (.body | contains($run_id))' \
              <<<"${existing_release}" >/dev/null; then
              echo "An existing draft release does not match this tag, revision, and workflow run." >&2
              exit 1
            fi
            gh release upload "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber \
              "${candidate_dir}/"*
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --draft \
              --prerelease \
              --title "Chat ${GITHUB_REF_NAME} (unsigned preview)" \
              --notes "${release_notes}" \
              "${candidate_dir}/"*
          fi
